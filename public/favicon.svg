<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching Hero Image Grey Tone -->
    <radialGradient id="heroBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="50%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#121212" />
    </radialGradient>
    
    <!-- Subtle Inner Glow / Border -->
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Base Container: Rounded Square with Hero Dark Grey Background -->
  <rect width="512" height="512" rx="112" fill="url(#heroBg)" />
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#subtleBorder)" stroke-width="4" />

