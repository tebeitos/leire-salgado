      V 334 
      H 242 
      C 260 334 269 328 274 310 
      H 284 
      V 356 
      H 132 
      V 338 
      H 150 
      V 166 
      H 132 
      Z
    " />

    <!-- Letter S -->
    <path d="
      M 374 196 
      C 370 162 344 144 308 144 
      C 270 144 246 166 246 194 
      C 246 220 264 236 298 250 
      C 338 268 360 286 360 314 
      C 360 346 332 366 292 366 
      C 250 366 226 340 222 304 
